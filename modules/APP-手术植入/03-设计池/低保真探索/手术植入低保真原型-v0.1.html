<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>手术植入低保真探索稿 v0.1</title>
  <style>
    *{box-sizing:border-box} :root{--ink:#202124;--muted:#6f7378;--line:#d2d5d9;--soft:#f1f3f4;--paper:#fff;--bg:#e8eaed;--dark:#303134}
    body{margin:0;color:var(--ink);background:var(--bg);font-family:Arial,"Microsoft YaHei",sans-serif}
    button{font:inherit;touch-action:manipulation;cursor:pointer}.stage{min-height:100dvh;padding:28px 16px 104px;display:flex;flex-direction:column;align-items:center}.note{width:min(390px,100%);margin:0 0 10px;color:var(--muted);font-size:12px;line-height:1.5}.phone{width:min(390px,100%);min-height:844px;background:#f8f9fa;border:2px solid #666;border-radius:24px;overflow:hidden;box-shadow:0 8px 24px #00000014}.appbar{height:60px;padding:0 14px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;background:var(--paper);border-bottom:1px solid var(--line)}.appbar h1{margin:0;text-align:center;font-size:18px}.back,.more{min-height:44px;border:0;background:transparent;color:var(--ink)}.back{text-align:left}.more{text-align:right}.body{padding:16px}.hero{padding:18px 16px;background:#fff;border-bottom:1px solid var(--line)}.hero-top{display:flex;justify-content:space-between;gap:12px}.hero code{min-width:42px;height:42px;display:grid;place-items:center;border-radius:10px;background:var(--dark);color:#fff;font-size:18px;font-weight:800}.hero h1{margin:10px 0 0;font-size:20px}.hero p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.section{margin-bottom:18px}.section h2{margin:0 0 10px;font-size:16px}.section-note{margin:-4px 0 10px;color:var(--muted);font-size:11px;line-height:1.5}.card{background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:10px}.card.pad{padding:14px}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.card-head strong{font-size:14px}.card p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.action{min-width:68px;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:var(--dark);color:#fff;font-size:12px;font-weight:700}.outline{min-height:44px;padding:0 12px;border:1px solid #8f9499;border-radius:8px;background:#fff;color:var(--ink);font-size:12px;font-weight:700}.flow{display:grid;gap:8px}.flow-step{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff}.flow-step b,.flow-step span{display:block}.flow-step b{font-size:13px}.flow-step span{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.4}.arrow{text-align:center;color:var(--muted);font-size:12px}.tag{display:inline-flex;align-items:center;min-height:26px;padding:0 8px;border-radius:13px;background:#e6e8ea;color:var(--ink);font-size:11px;font-weight:700}.tag.dark{background:var(--dark);color:#fff}.context{padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}.context strong{display:block;font-size:15px}.context p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.statebar{margin:12px 16px 0;padding:12px;border-left:4px solid var(--dark);border-radius:7px;background:#e6e8ea;font-size:12px;line-height:1.5}.statebar b{display:block;margin-bottom:4px;font-size:13px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:700}.field input,.field select{width:100%;min-height:48px;padding:0 12px;border:1px solid #9aa0a6;border-radius:8px;background:#fff;font-size:15px}.row{min-height:58px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row b,.row span{display:block}.row b{font-size:13px}.row span{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}.qty{font-size:13px;font-weight:800;white-space:nowrap}.choice-grid{display:grid;gap:8px}.choice{min-height:68px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left}.choice.active{border:2px solid var(--dark);background:#f0f1f2}.choice b,.choice span{display:block}.choice b{font-size:13px}.choice span{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}.check{min-height:54px;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.check:last-child{border-bottom:0}.box{width:22px;height:22px;border:2px solid #70757a;border-radius:5px;display:grid;place-items:center;font-size:12px}.box.on{background:var(--dark);color:#fff}.sticky{position:sticky;bottom:0;display:grid;gap:8px;padding:12px 16px 18px;border-top:1px solid var(--line);background:#fff}.primary,.secondary{min-height:48px;border-radius:9px;padding:0 14px;font-weight:700}.primary{border:0;background:var(--dark);color:#fff}.secondary{border:1px solid #8f9499;background:#fff}.result{margin:16px;padding:18px 14px;border:2px solid var(--dark);border-radius:11px;background:#fff;text-align:center}.result h2{margin:0 0 8px;font-size:18px}.result p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.variantbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:grid;grid-template-columns:44px minmax(220px,auto) 44px;align-items:center;background:#111;color:#fff;border-radius:26px;padding:4px;box-shadow:0 8px 24px #00000047;z-index:20}.variantbar button{min-width:44px;min-height:44px;border:0;background:transparent;color:#fff;font-size:20px}.variantbar div{text-align:center;font-size:11px}.routebar{width:min(390px,100%);margin:10px 0 0;display:flex;gap:6px;flex-wrap:wrap}.routebar button{min-height:44px;border:1px solid #aeb2b7;border-radius:22px;background:#fff;padding:0 12px;font-size:11px}.routebar button.active{background:var(--dark);color:#fff}
  </style>
</head>
<body>
  <main class="stage">
    <p class="note">PROTOTYPE — 手术植入业务探索与结构验证稿。沿用原始全链路低保真风格；全局／组总览是审阅导航，不是业务员正式页面。状态只用于暴露结构缺口。</p>
    <div class="phone" id="app"></div>
    <nav class="routebar" aria-label="原型路线"><button data-route="group">I 组总览</button><button data-route="page">I01 手术植入记录</button></nav>
    <div class="variantbar"><button id="prev" aria-label="上一方案">‹</button><div id="variant-label"></div><button id="next" aria-label="下一方案">›</button></div>
  </main>
  <script>
    const qs=new URLSearchParams(location.search);let route=qs.get('route')==='page'?'page':'group';let variant=['A','B','C'].includes(qs.get('variant'))?qs.get('variant'):'A';let state=['draft','source','exception','formal','recovery'].includes(qs.get('state'))?qs.get('state'):'draft';
    const names={A:'A · 单页工作区',B:'B · 分段展开',C:'C · 结果优先'};
    const stateCopy={draft:['未正式形成','记录尚未提交；可继续补齐，当前不回写手术通知。'],source:['通知来源上下文','已从 O01／G03 进入；候选实物只是来源候选，不默认全选。'],exception:['校验异常占位','未形成正式结果；异常审核反馈与权限尚待确认。'],formal:['正式结果已形成','已输出正式记录引用；仅通知来源明细回写手术通知。'],recovery:['可补齐重提','仍未正式形成；可补齐后重新提交，放弃／超期退出不回写。']};
    const setUrl=()=>{const p=new URLSearchParams({route,variant,state});history.replaceState({},'',`${location.pathname}?${p}`);render()};
    const stateButtons=()=>Object.entries({draft:'未完成',source:'通知进入',exception:'校验异常',formal:'正式结果',recovery:'失败恢复'}).map(([k,v])=>`<button class="choice ${state===k?'active':''}" data-state="${k}"><b>${v}</b><span>${stateCopy[k][0]}</span></button>`).join('');
    function group(){return `<header class="hero"><div class="hero-top"><code>I</code><span class="tag">宏观审查／低保真探索</span></div><h1>手术植入</h1><p>现实手术完成后，登记本次实际销售事实。正式结果只取实际销售明细；通知来源明细形成回写。</p></header><div class="body"><section class="section"><h2>业务主线</h2><div class="flow"><div class="flow-step"><b>建立实际手术事件</b><span>一次患者、一次现实手术事件，对应一条植入销售记录。</span></div><div class="arrow">↓</div><div class="flow-step"><b>录入实际销售明细</b><span>扫码／手动添加；业务员侧常备物资、通知来源或混合来源。</span></div><div class="arrow">↓</div><div class="flow-step"><b>提交校验与结果</b><span>通过后形成正式结果；未通过则保留未正式状态。</span></div></div></section><section class="section"><h2>入口与出口</h2><div class="card pad"><div class="row"><div><b>G01 独立入口</b><span>不预带需求组；使用通知来源时再关联上下文。</span></div><strong>→ I01</strong></div><div class="row"><div><b>O01／G03 手术情况确认</b><span>携带需求组、任务、返回位置和候选实物。</span></div><strong>→ I01</strong></div><div class="row"><div><b>正式结果</b><span>输出记录引用和通知来源明细，返回原任务并重算责任与结余。</span></div><strong>回写</strong></div></div></section><section class="section"><h2>关键边界</h2><div class="card pad"><p>动作事实不自动形成销售；库存内部、Web 后台、医患管理、销售汇总与提成不在本组。</p></div></section><section class="section"><h2>页面细览</h2><button class="card pad" style="width:100%;text-align:left" data-route="page"><div class="card-head"><strong>I01 · 手术植入记录</strong><span>细览 ›</span></div><p>一次记录的完整工作区；明细、来源、凭证、提交、结果与恢复作为区块／状态。</p></button></section></div>`}
    function commonContext(){return `<div class="context"><strong>市骨科医院 · 脊柱外科</strong><p>李医生 · 患者与住院号由手术植入采集<br><span class="tag">${state==='source'?'O01／G03 任务进入':'G01 独立入口'}</span></p></div><div class="statebar"><b>${stateCopy[state][0]}</b>${stateCopy[state][1]}</div>`}
    function baseFields(){return `<section class="section"><h2>手术事件与基础信息</h2><div class="card pad"><div class="field"><label>患者姓名</label><input value="待录入" aria-label="患者姓名"></div><div class="field"><label>住院号</label><input value="待录入" aria-label="住院号"></div><div class="field"><label>实际手术动作（事实记录）</label><select><option>待记录（不自动形成销售）</option><option>更换／翻修（仅动作事实）</option><option>取出／保留（仅动作事实）</option></select><p class="section-note">推导承载：动作事实与销售结果分离。</p></div></div></section>`}
    function salesBlock(){return `<section class="section"><div class="card pad"><div class="card-head"><h2 style="margin:0">实际销售明细</h2><button class="outline">添加明细</button></div><div class="row"><div><b>待添加产品</b><span>扫码或手动添加同一销售明细</span></div><span class="qty">—</span></div><div class="row"><div><b>来源分配</b><span>业务员侧常备物资／通知来源／混合来源（按明细记录）</span></div><span class="tag">待分配</span></div></div></section>`}
    function evidence(){return `<section class="section"><h2>凭证与提交</h2><div class="card pad"><div class="check"><span class="box"> </span><span>凭证已关联（文件不可覆盖）</span><span class="tag">待确认</span></div><div class="check"><span class="box"> </span><span>提交前自动校验</span><span class="tag">系统动作</span></div></div></section>`}
    function outcome(){const formal=state==='formal';return `<section class="section"><h2>结果与恢复</h2><div class="card pad"><div class="choice-grid">${stateButtons()}</div>${formal?'<div class="result"><h2>正式植入结果</h2><p>记录引用：待系统生成<br>通知来源明细：回写手术通知并重算责任与结余</p></div>':state==='exception'?'<div class="result"><h2>未形成正式结果</h2><p>进入公司审核路径；审核角色、反馈方式和权限尚待确认。</p></div>':''}</div></section>`}
    function variantA(){return `${commonContext()}<div class="body">${baseFields()}${salesBlock()}${evidence()}${outcome()}</div><div class="sticky"><button class="primary">提交并自动校验</button><button class="secondary">暂存，稍后补齐</button></div>`}
    function variantB(){return `${commonContext()}<div class="body"><section class="section"><h2>分段填写</h2><div class="flow"><div class="card pad"><div class="card-head"><strong>1 · 手术事件与基础信息</strong><span class="tag dark">当前</span></div><p>患者、住院号、动作事实。动作不自动形成销售。</p></div><div class="card pad"><div class="card-head"><strong>2 · 实际销售明细与来源</strong><span class="tag">待填写</span></div><p>添加产品、数量、批号／追溯身份及来源分配。</p></div><div class="card pad"><div class="card-head"><strong>3 · 凭证、校验与正式结果</strong><span class="tag">待填写</span></div><p>提交后通过才形成正式结果；异常不回写。</p></div></div></section><section class="section"><h2>当前段落</h2>${baseFields()}</section>${outcome()}</div><div class="sticky"><button class="primary">保存并进入下一段</button><button class="secondary">返回入口</button></div>`}
    function variantC(){return `${commonContext()}<div class="body"><section class="section"><div class="card pad"><div class="card-head"><strong>本次记录摘要</strong><span class="tag">${stateCopy[state][0]}</span></div><div class="row"><div><b>患者／手术事件</b><span>患者待录入 · 事件待确认</span></div><span>›</span></div><div class="row"><div><b>实际销售明细</b><span>0 项 · 来源未分配</span></div><span>›</span></div><div class="row"><div><b>凭证与校验</b><span>未完成 · 不可形成正式结果</span></div><span>›</span></div></div></section><section class="section"><h2>必须完成</h2><div class="card pad"><div class="flow"><div class="flow-step"><b>补齐患者与手术事件</b><span>建立记录上下文。</span></div><div class="flow-step"><b>添加实际销售明细</b><span>只有实际销售明细进入正式结果。</span></div><div class="flow-step"><b>提交并通过自动校验</b><span>通过后才回写通知来源明细。</span></div></div></div></section>${salesBlock()}${outcome()}</div><div class="sticky"><button class="primary">继续补齐记录</button><button class="secondary">返回入口</button></div>`}
    function page(){return `<header class="appbar"><button class="back" data-route="group">‹ I组总览</button><h1>I01 手术植入记录</h1><button class="more">⋯</button></header>${variant==='A'?variantA():variant==='B'?variantB():variantC()}`}
    function render(){document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));document.getElementById('app').innerHTML=route==='group'?group():page();document.getElementById('variant-label').textContent=route==='group'?'I组总览 · 业务承载结构':names[variant];document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=b.dataset.route;setUrl()});document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;setUrl()})}
    function cycle(delta){const a=['A','B','C'];variant=a[(a.indexOf(variant)+delta+a.length)%a.length];route='page';setUrl()}
    document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
  </script>
</body>
</html>
