<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>I01 手术植入记录｜低保真探索 v0.1</title>
  <style>
    :root{--ink:#202428;--muted:#667078;--line:#d8dde1;--paper:#f5f6f7;--card:#fff;--accent:#2d6cdf;--warn:#a76100;--danger:#a73535;--ok:#287a52;--soft:#eef2f5;--shadow:0 10px 28px rgba(29,38,48,.12)}
    *{box-sizing:border-box}html{background:#e8eaed;color:var(--ink);font:15px/1.5 Arial,"Microsoft YaHei",sans-serif}body{margin:0;background:#e8eaed}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;border:0}.stage{min-height:100dvh;padding:28px 16px 104px;display:flex;flex-direction:column;align-items:center}.prototype-note{width:min(390px,100%);margin:0 0 10px;color:var(--muted);font-size:12px}.phone{width:min(390px,100%);min-height:844px;background:#f8f9fa;border:2px solid #666;border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.08)}.top{height:60px;padding:0 14px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.top h1{margin:0;text-align:center;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .back,.top .more{min-height:44px;background:transparent;color:var(--ink)}.top .back{text-align:left}.top .more{text-align:right;font-size:12px;font-weight:700}.top-subtitle{padding:9px 16px;background:#fff;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.04em}.badge{font-size:11px;line-height:1;padding:6px 8px;border:1px solid var(--line);border-radius:999px;color:#48515a;background:#f7f8f9;white-space:nowrap}.driver{margin:12px 12px 0;border:1px dashed #aeb7bf;background:#fbfcfd;border-radius:10px;padding:10px 11px;color:#4a555e}.driver strong{color:var(--ink)}.driver .row{margin-top:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.tiny{font-size:12px;color:var(--muted)}.section{padding:14px 16px 0}.section h2{font-size:16px;margin:0 0 10px}.card{background:#fff;border:1px solid var(--line);border-radius:11px}.pad{padding:13px}.context{display:flex;gap:8px;flex-wrap:wrap}.context span{font-size:12px;border-radius:5px;padding:4px 7px;background:var(--soft);color:#45515a}.context .entry{background:#e6e8ea;color:var(--ink);font-weight:700}.notice{border-left:3px solid var(--dark);padding-left:9px}.field{margin-top:10px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;min-height:48px;border:1px solid #9aa0a6;border-radius:8px;background:#fff;padding:10px 11px;outline:none;font-size:16px}.field input:focus,.field select:focus,button:focus-visible{outline:3px solid #a9c2ff;outline-offset:2px}.capture{border:1px dashed #7f8489;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:13px;color:#59636b;background:#fff;border-radius:9px}.capture b{color:var(--ink);margin-bottom:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{min-height:44px;border-radius:8px;padding:9px 13px;border:1px solid #8f9499;background:#fff;color:var(--ink)}.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:700}.btn.subtle{background:#f1f3f4}.btn.warn{border-color:#c39a5b;color:#805000;background:#fffaf2}.btn.danger{border-color:#b76f6f;color:#8f2c2c;background:#fff8f8}.items{display:grid;gap:8px}.item{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.item h3{margin:0;font-size:14px}.item p{margin:4px 0 0;font-size:12px;color:var(--muted)}.source{margin-top:8px;padding:7px 8px;border-radius:6px;background:#eceeef;font-size:12px}.source.ok{background:#eceeef;color:var(--ink)}.source.warn{background:#f0f1f2;color:#6b4b19;border-left:3px solid #8b6b34}.source.neutral{background:#f3f4f5}.evidence{display:flex;align-items:center;gap:10px}.thumb{height:56px;width:70px;border:1px solid #9aa0a6;border-radius:7px;background:repeating-linear-gradient(135deg,#edf0f2 0 7px,#fafbfc 7px 14px);display:grid;place-items:center;color:#737e86;font-size:11px;flex:0 0 auto}.result{padding:12px;border-radius:10px;border:2px solid var(--dark);background:#fff}.result.pending{border-color:#8b6b34;background:#fff}.result.error{border-color:#8a4a4a;background:#fff}.result strong{display:block;margin-bottom:3px}.result p{margin:0;font-size:13px;color:#48545c}.sticky{position:sticky;bottom:0;padding:12px 16px 18px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:9}.sticky-inner{display:flex;gap:8px}.sticky .btn{flex:1}.switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:grid;grid-template-columns:44px minmax(190px,auto) 44px;align-items:center;background:#111;color:#fff;border-radius:26px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:20}.switcher button{min-width:44px;min-height:44px;background:transparent;color:#fff;font-size:20px}.switcher div{text-align:center;font-size:12px}.divider{height:1px;background:var(--line);margin:12px 0}.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--dark)}.callout{padding:10px;border-radius:7px;background:#e6e8ea;color:#4c5860;font-size:12px}.list{display:grid;gap:6px;margin:0;padding:0;list-style:none}.list li{padding-left:15px;position:relative}.list li:before{content:"";width:6px;height:6px;border-radius:50%;background:#7f8489;position:absolute;left:0;top:.65em}.hidden{display:none!important}@media(max-width:370px){.stage{padding-left:0;padding-right:0}.prototype-note{padding-left:12px;padding-right:12px}.phone{border-radius:0;border-left:0;border-right:0;min-height:100dvh}.section{padding-left:14px;padding-right:14px}.driver{margin-left:10px;margin-right:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="stage">
    <p class="prototype-note">PROTOTYPE — 手术植入 I01 低保真结构探索稿。与《手术通知.html》采用同一审阅载体标准；不是业务员正式页面、视觉稿、代码实现或设计验收。</p>
    <main class="phone" id="app"></main>
  </div>
  <div class="switcher" aria-label="低保真结构变体切换">
    <button id="prev" aria-label="上一种结构" title="上一种结构">‹</button>
    <div id="variant-label">A · 连续工作区</div>
    <button id="next" aria-label="下一种结构" title="下一种结构">›</button>
  </div>
  <script>
    const params=new URLSearchParams(location.search);
    const variant=(params.get('variant')||'A').toUpperCase();
    const state=params.get('state')||'draft';
    const entry=params.get('entry')||'g01';
    const sampleItems=[
      {name:'探索样例植入物 A',spec:'规格／型号：SAMPLE-A',lot:'LOT-示例-001',qty:'1',source:'业务员侧常备物资',kind:'ok'},
      {name:'探索样例植入物 B',spec:'规格／型号：SAMPLE-B',lot:'LOT-示例-002',qty:'1',source:'手术通知来源 · 需求组示例',kind:'ok'},
      {name:'探索样例植入物 C',spec:'规格／型号：SAMPLE-C',lot:'待识别',qty:'1',source:'已使用，来源待核实',kind:'warn'}
    ];
    function visibleItems(){if(state==='mixed')return sampleItems;if(state==='pending')return [sampleItems[0],sampleItems[2]];return sampleItems.slice(0,2)}
    function pageTop(title,subtitle='同一条实际手术植入记录'){
      return `<div class="top"><button class="back" data-action="back" aria-label="返回入口">← 返回</button><h1>${title}</h1><button class="more" data-action="info" aria-label="页面信息">I01</button></div><div class="top-subtitle">${subtitle} · 低保真探索</div>`;
    }
    function driver(){
      const entryText=entry==='notice'?'O01／G03 手术情况确认 → I01':'G01 首页 → I01';
      return `<div class="driver"><div class="row"><strong>原型驱动器</strong><span class="badge">只用于观察结构</span></div><div class="tiny" style="margin-top:5px">不是用户可选的来源或校验结果，不代表正式实现。</div><div class="row wrap"><span class="tiny">进入上下文：<b>${entryText}</b></span><span class="tiny">状态：<b>${stateLabel()}</b></span></div><div class="actions"><button class="btn subtle" data-entry="g01">G01 进入</button><button class="btn subtle" data-entry="notice">通知进入</button><button class="btn subtle" data-state="draft">新建</button><button class="btn subtle" data-state="scan">已获取</button><button class="btn subtle" data-state="mixed">混合来源</button><button class="btn subtle" data-state="pending">待核实</button><button class="btn subtle" data-state="formal">正式结果</button><button class="btn subtle" data-state="error">校验异常</button></div></div>`;
    }
    function stateLabel(){return ({draft:'新建／未采集',scan:'明细采集中',mixed:'明细已回显',pending:'来源待核实',formal:'正式结果',error:'未正式／校验异常'})[state]||'探索状态'}
    function context(){return `<section class="section"><h2>入口上下文</h2><div class="card pad"><div class="context"><span class="entry">${entry==='notice'?'O01／G03 通知任务进入':'G01 独立进入'}</span><span>${entry==='notice'?'带入需求组与返回位置':'无通知上下文'}</span><span>记录身份：I01</span></div>${entry==='notice'?'<p class="tiny notice" style="margin:9px 0 0">通知入口只带入候选实物和返回位置；不代表已经发生植入。</p>':'<p class="tiny" style="margin:9px 0 0">独立进入后仍建立同一种实际手术事件与植入销售记录。</p>'}</div></section>`}
    function event(){return `<section class="section"><h2>手术事件与基础信息</h2><div class="card pad"><div class="field"><label for="hospital">医院</label><input id="hospital" placeholder="填写／回显医院" value="${state==='draft'?'':'探索样例医院'}"></div><div class="field"><label for="ward">科室／住院号</label><input id="ward" placeholder="填写／回显必要基础信息" value="${state==='draft'?'':'骨科 · 示例住院号'}"></div><p class="tiny" style="margin:9px 0 0">探索表现：动作事实与实际销售结果分离；未在此处自动生成销售。</p></div></section>`}
    function capture(){const got=['scan','mixed','pending','formal','error'].includes(state);return `<section class="section"><h2>实际使用凭证与明细采集</h2><div class="card pad"><div class="capture" aria-live="polite"><b>${got?'已取得探索样例凭证':'从术后使用登记单开始'}</b><span>${got?'可补拍、再次扫描或人工补录实际凭证事实':'拍照／扫码获取胶贴；识别不完整时继续补拍或手动补齐'}</span><div class="actions"><button class="btn primary" data-action="capture">${got?'再次获取':'拍照／扫描胶贴'}</button><button class="btn" data-action="manual">手动补录实际明细</button></div></div>${got?`<div class="items" style="margin-top:10px">${visibleItems().map(item=>itemRow(item)).join('')}</div>`:'<div class="callout" style="margin-top:10px">人工补录只补齐凭证证明的实际事实；不打开公司完整产品目录，也不让业务员指定来源。</div>'}</div></section>`}
    function itemRow(item){return `<article class="item"><div class="row"><h3>${item.name}</h3><span class="badge">数量 ${item.qty}</span></div><p>${item.spec} · 批号／追溯身份：${item.lot}</p><div class="source ${item.kind}"><b>系统来源结果：</b>${item.source}${item.kind==='warn'?'（不结清通知候选）':''}</div></article>`}
    function evidence(){return `<section class="section"><h2>凭证关联</h2><div class="card pad"><div class="evidence"><div class="thumb">胶贴样例</div><div><b>术后使用登记单（探索样例）</b><div class="tiny">已关联本次植入记录 · 新文件不静默覆盖</div></div></div><div class="actions"><button class="btn" data-action="evidence">${state==='draft'?'关联凭证':'替换为新版本（探索）'}</button><button class="btn subtle" data-action="view">查看凭证</button></div><div class="divider"></div><label class="check"><input type="checkbox" ${state==='draft'?'':'checked'}><span>我已核对图片中的实际产品、批号／可追溯身份和数量（探索确认，不构成权限定义）</span></label></div></section>`}
    function result(){if(state==='formal')return `<section class="section"><h2>正式结果与通知回写</h2><div class="result"><strong>正式植入记录已形成（探索样例）</strong><p>记录引用：IMPLANT-DEMO-001。业务员侧常备物资明细不回写通知；手术通知来源明细按已确认接口回写并重算责任与结余。</p><div class="actions"><button class="btn" data-action="return">返回${entry==='notice'?'通知任务':'G01 首页'}</button><button class="btn subtle" data-action="later">查看后续条件操作</button></div></div></section>`;if(state==='pending')return `<section class="section"><h2>结果状态</h2><div class="result pending"><strong>已使用，来源待核实</strong><p>实际使用事实保留；本条不结清通知候选，通知侧不能完成。后续核实后校正责任或撤销关联。</p><div class="actions"><button class="btn warn" data-action="recover">补齐核验事实</button><button class="btn subtle" data-action="return">暂存并返回</button></div></div></section>`;if(state==='error')return `<section class="section"><h2>结果状态</h2><div class="result error"><strong>未正式形成：校验异常（探索样例）</strong><p>示例缺口：凭证中的批号／可追溯身份未清晰。实际使用不被当作正式结果；不产生通知正式回写。</p><div class="actions"><button class="btn primary" data-action="recover">补拍／重新识别</button><button class="btn subtle" data-action="return">返回继续编辑</button></div></div></section>`;return `<section class="section"><h2>下一步</h2><div class="callout">明细形成后，关联凭证并提交校验。通过才形成正式结果；未通过则留在同一条记录内补齐重提。</div></section>`}
    function variantA(){return `${pageTop('手术植入记录','连续工作区 · 以现场操作顺序组织')}${driver()}${context()}${event()}${capture()}${evidence()}${result()}<div class="sticky"><div class="sticky-inner"><button class="btn" data-action="save">暂存未正式</button><button class="btn primary" data-action="submit">${state==='formal'?'查看正式记录':'关联凭证并提交校验'}</button></div></div>`}
    function variantB(){const got=['scan','mixed','pending','formal','error'].includes(state);return `${pageTop('手术植入记录','核对清单 · 先看缺口，再完成提交')}${driver()}${context()}<section class="section"><h2>当前完成度</h2><div class="card pad"><ul class="list"><li>${got?'已取得术后使用凭证':'待取得术后使用凭证'}</li><li>${got?'已形成 '+(state==='mixed'?3:2)+' 条探索明细':'待形成实际销售明细'}</li><li>${state==='pending'?'存在来源待核实明细':got?'系统已回显来源结果':'来源结果将在明细形成后回查'}</li><li>${state==='formal'?'已通过自动校验并形成正式结果':'待关联凭证并提交自动校验'}</li></ul></div></section><section class="section"><h2>逐项核对</h2><div class="items">${got?visibleItems().map(item=>itemRow(item)).join(''):'<div class="card pad"><div class="callout">先点击“拍照／扫描胶贴”取得探索样例，观察识别不完整时的补拍与手动补录位置。</div></div>'}</div></section>${evidence()}${result()}<div class="sticky"><div class="sticky-inner"><button class="btn subtle" data-action="back">返回入口</button><button class="btn primary" data-action="submit">${state==='formal'?'查看通知回写':'提交并校验'}</button></div></div>`}
    function variantC(){const got=['scan','mixed','pending','formal','error'].includes(state);return `${pageTop('手术植入记录','凭证优先 · 先锁定实物事实，再回显业务结果')}${driver()}${context()}<section class="section"><h2>第一屏：术后登记单</h2><div class="card pad"><div class="capture"><b>${got?'探索样例登记单已锁定':'这里先放置真实术后使用登记单'}</b><span>胶贴是本次实际植入事实的核心来源</span><div class="actions"><button class="btn primary" data-action="capture">${got?'补拍／再次扫描':'拍照并识别胶贴'}</button><button class="btn" data-action="manual">识别不完整，手动补齐</button></div></div><p class="tiny" style="margin:9px 0 0">所有识别方式回到同一种实际销售明细；样例仅用于观察结构。</p></div></section><section class="section"><h2>识别结果与人工核对</h2><div class="card pad">${got?`<div class="items">${visibleItems().map(item=>itemRow(item)).join('')}</div>`:'<div class="callout">还没有明细。真实场景中应允许多次扫描、补拍和受限手动补录。</div>'}</div></section><section class="section"><h2>系统回查的来源结果</h2><div class="card pad"><p class="tiny" style="margin:0 0 9px">不提供来源选择；系统依据上游实物链和最近有效交接回查。</p>${got?`<div class="items">${visibleItems().map(item=>`<div class="row"><span>${item.name}</span><span class="badge">${item.source}</span></div>`).join('')}</div>`:'<div class="tiny">明细形成后显示逐项来源结果。</div>'}</div></section>${evidence()}${result()}<div class="sticky"><div class="sticky-inner"><button class="btn" data-action="save">保存当前事实</button><button class="btn primary" data-action="submit">${state==='formal'?'返回结果':'提交校验'}</button></div></div>`}
    function render(){document.getElementById('app').innerHTML=variant==='B'?variantB():variant==='C'?variantC():variantA();const names={A:'A · 连续工作区',B:'B · 核对清单',C:'C · 凭证优先'};const label=document.getElementById('variant-label');if(label)label.textContent=names[variant]||names.A;document.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>{const u=new URL(location.href);u.searchParams.set('entry',b.dataset.entry);location.href=u});document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{const u=new URL(location.href);u.searchParams.set('state',b.dataset.state);location.href=u});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));const prev=document.getElementById('prev');const next=document.getElementById('next');if(prev)prev.onclick=()=>cycle(-1);if(next)next.onclick=()=>cycle(1);}
    function action(a){const live=document.getElementById('app');if(a==='capture'||a==='manual'){live.querySelectorAll('.capture').forEach(x=>x.insertAdjacentHTML('beforeend','<div class="tiny" style="margin-top:8px;color:#287a52">已记录探索操作；可用顶部状态驱动器观察后续状态。</div>'));}else if(a==='submit'){live.querySelectorAll('.result').forEach(x=>x.scrollIntoView({behavior:'smooth',block:'center'}));alert('原型提示：正式结果需由真实自动校验决定；本按钮不代表可手动选择校验结果。请用顶部状态驱动器切换观察。');}else if(a==='evidence'){alert('原型提示：这里仅观察凭证关联位置，不定义附件字段、权限或审核。')}else if(a==='return'||a==='back'){alert('原型提示：应返回发起入口并保留记录上下文。')}else if(a==='recover'){alert('原型提示：补齐事实后在同一条记录重提，不静默产生通知正式回写。')}else if(a==='save'){alert('原型提示：保存的是未正式记录，不代表提交或通知回写。')}else if(a==='view'||a==='later'){alert('原型提示：此处只展示后续条件入口，不扩展为新页面。')}}
    document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const order=['A','B','C'],i=order.indexOf(variant),n=order[(i+(e.key==='ArrowRight'?1:2))%3],u=new URL(location.href);u.searchParams.set('variant',n);location.href=u});render();
  </script>
</body>
</html>
