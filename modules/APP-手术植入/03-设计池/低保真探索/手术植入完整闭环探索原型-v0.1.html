<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>手术植入完整闭环探索原型 v0.1</title>
  <style>
    *{box-sizing:border-box}:root{--ink:#202124;--muted:#6f7378;--line:#d2d5d9;--paper:#fff;--bg:#e8eaed;--dark:#303134;--soft:#f1f3f4}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.stage{min-height:100dvh;padding:28px 16px 120px;display:flex;flex-direction:column;align-items:center}.note,.routebar{width:min(390px,100%)}.note{margin:0 0 10px;color:var(--muted);font-size:12px;line-height:1.5}.phone{width:min(390px,100%);min-height:844px;overflow:hidden;border:2px solid #666;border-radius:24px;background:#f8f9fa;box-shadow:0 8px 24px #00000014}.appbar{height:60px;padding:0 14px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;background:var(--paper);border-bottom:1px solid var(--line)}.appbar h1{margin:0;text-align:center;font-size:17px}.back,.more{min-height:44px;border:0;background:transparent;color:var(--ink)}.back{text-align:left}.more{text-align:right}.body{padding:16px}.hero,.context{padding:16px;background:#fff;border-bottom:1px solid var(--line)}.hero-top,.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.hero code{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;background:var(--dark);color:#fff;font-weight:800;font-size:18px}.hero h1{margin:10px 0 0;font-size:20px}.hero p,.context p,.card p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.context strong{display:block;font-size:15px}.section{margin-bottom:18px}.section h2{margin:0 0 10px;font-size:16px}.hint{margin:-4px 0 10px;color:var(--muted);font-size:11px;line-height:1.45}.card{margin-bottom:10px;border:1px solid var(--line);border-radius:11px;background:#fff}.pad{padding:14px}.card b{font-size:14px}.tag{display:inline-flex;align-items:center;min-height:26px;padding:0 8px;border-radius:13px;background:#e6e8ea;font-size:11px;font-weight:700;white-space:nowrap}.tag.dark{background:var(--dark);color:#fff}.flow{display:grid;gap:8px}.flow-step{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff}.flow-step b,.flow-step span{display:block}.flow-step b{font-size:13px}.flow-step span{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.45}.arrow{text-align:center;color:var(--muted);font-size:12px}.route-card{width:100%;min-height:70px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left}.route-card b,.route-card span{display:block}.route-card b{font-size:13px}.route-card span{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}.route-card.active{border:2px solid var(--dark);background:#f0f1f2}.row{min-height:58px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row b,.row span{display:block}.row b{font-size:13px}.row span{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:700}.field input,.field select{width:100%;min-height:48px;padding:0 12px;border:1px solid #9aa0a6;border-radius:8px;background:#fff;font-size:15px}.choice{width:100%;min-height:68px;margin-bottom:8px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left}.choice.active{border:2px solid var(--dark);background:#f0f1f2}.choice b,.choice span{display:block}.choice b{font-size:13px}.choice span{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}.state{margin:12px 16px 0;padding:12px;border-left:4px solid var(--dark);border-radius:7px;background:#e6e8ea;font-size:12px;line-height:1.5}.state b{display:block;margin-bottom:4px;font-size:13px}.check{min-height:54px;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.check:last-child{border-bottom:0}.box{width:22px;height:22px;display:grid;place-items:center;border:2px solid #70757a;border-radius:5px;font-size:12px}.box.on{background:var(--dark);color:#fff}.primary,.secondary,.danger{min-height:48px;padding:0 14px;border-radius:9px;font-weight:700}.primary{border:0;background:var(--dark);color:#fff}.secondary{border:1px solid #8f9499;background:#fff}.danger{border:2px solid var(--dark);background:#fff;color:var(--ink)}.sticky{position:sticky;bottom:0;z-index:3;display:grid;gap:8px;padding:12px 16px 18px;border-top:1px solid var(--line);background:#fff}.result{margin:16px;padding:18px 14px;border:2px solid var(--dark);border-radius:11px;background:#fff;text-align:center}.result h2{margin:0 0 8px;font-size:18px}.result p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.callback{padding:12px;border:2px solid var(--dark);border-radius:10px;background:#fff;font-size:12px;line-height:1.55}.callback b{display:block;margin-bottom:4px;font-size:13px}.map{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:11px;line-height:1.55}.routebar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.routebar button{min-height:42px;padding:0 11px;border:1px solid #aeb2b7;border-radius:21px;background:#fff;font-size:11px}.routebar button.active{background:var(--dark);color:#fff}.driver{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(390px,calc(100% - 32px));padding:8px 12px;border-radius:18px;background:#111;color:#fff;box-shadow:0 8px 24px #00000047;font-size:10px;line-height:1.45;z-index:10}.driver b{display:block;font-size:11px}.driver button{margin-top:5px;min-height:32px;padding:0 9px;border:1px solid #777;border-radius:16px;background:#222;color:#fff;font-size:10px}.driver code{color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}.muted{color:var(--muted);font-size:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 button{min-height:50px}.hide{display:none}
  </style>
</head>
<body>
<main class="stage">
  <p class="note">PROTOTYPE — 可点击的手术植入完整闭环探索。灰阶风格与导航参考原始手术通知总原型；本文件不调用真实接口、不形成生产代码。</p>
  <div class="phone" id="app"></div>
  <nav class="routebar" id="routebar" aria-label="探索节点"></nav>
  <aside class="driver" id="driver"></aside>
</main>
<script>
// 纯状态模块：UI 只渲染 state 并 dispatch，不在这里引用 DOM。
const ImplantMachine=(()=>{
  const initial=()=>({route:'index',origin:null,event:false,patient:false,lines:0,source:null,evidence:false,validation:'idle',result:'none',callback:'none',recordRef:null,last:'尚未开始',correction:false});
  const reduce=(s,a)=>{let n={...s};switch(a.type){
    case 'GO':n.route=a.route;n.last=`进入 ${a.route}`;break;
    case 'START':n.origin=a.origin;n.route='I01';n.last=a.origin==='notice'?'从 O01／G03 任务进入':'从 G01 独立进入';break;
    case 'SAVE_EVENT':n.event=true;n.patient=true;n.route='I02';n.last='实际手术事件与患者基础信息已建立';break;
    case 'ADD_LINE':n.lines+=1;n.last='已添加一条实际销售明细';break;
    case 'TO_SOURCE':n.route='I03';n.last='进入来源分配';break;
    case 'SOURCE':n.source=a.source;n.route='I04';n.last=`已选择${{self:'业务员侧常备物资',notice:'手术通知来源',mixed:'混合来源'}[a.source]}`;break;
    case 'EVIDENCE':n.evidence=true;n.last='凭证已关联（探索状态）';break;
    case 'SUBMIT':if(!n.event||!n.patient||!n.lines||!n.source||!n.evidence){n.validation='incomplete';n.route='I05';n.last='提交未通过：仍可补齐，未形成正式结果'}else{n.validation=a.mode;n.route='I05';n.last=a.mode==='pass'?'自动校验通过':'自动校验异常（探索场景）';if(a.mode==='pass'){n.result='formal';n.recordRef=n.correction?'IMP-COR-002':'IMP-20260825-001';n.callback=(n.source==='self')?'none':'forward'}}break;
    case 'RESUME':n.validation='idle';n.route=a.route||'I01';n.last='回到记录补齐／重提';break;
    case 'EXIT':n.validation='exited';n.result='none';n.callback='none';n.route='I05';n.last='记录退出；未形成正式结果，未回写通知';break;
    case 'CANCEL':n.result='canceled';n.callback=(n.source==='self')?'none':'reverse';n.last='取消／失效：原记录保留，通知来源反向回写';break;
    case 'CORRECT':n.result='correcting';n.callback=(n.source==='self')?'none':'reverse';n.correction=true;n.route='I02';n.lines=0;n.source=null;n.evidence=false;n.validation='idle';n.last='原结果保留并已反向调整；开始形成正确销售结果';break;
  }return n};return{initial,reduce};})();

let state=ImplantMachine.initial();
const labels={index:'全部页面总览',group:'I 组总览',I01:'I01 建立事件',I02:'I02 添加明细',I03:'I03 来源分配',I04:'I04 凭证与确认',I05:'I05 校验与结果'};
const setUrl=()=>{const p=new URLSearchParams({route:state.route,origin:state.origin||'',result:state.result});history.replaceState({},'',location.pathname+'?'+p)};
const dispatch=a=>{state=ImplantMachine.reduce(state,a);setUrl();render()};
const originText=()=>state.origin==='notice'?'O01／G03「手术情况确认」任务':'G01 独立入口';
const sourceText=()=>({self:'业务员侧常备物资',notice:'手术通知来源',mixed:'混合来源'})[state.source]||'未分配';
const callbackText=()=>state.callback==='forward'?'正向回写：仅通知来源明细回写手术通知；重算责任与结余':state.callback==='reverse'?'反向回写：仅原通知来源明细反向调整；业务员侧常备物资不回写':'无手术通知回写';
const context=()=>`<div class="context"><strong>${originText()}</strong><p>当前对象：一次实际手术事件下的植入销售记录<br><span class="tag">${state.recordRef||'未形成正式记录'}</span></p></div>`;
const statePanel=()=>`<div class="state"><b>当前业务状态：${state.last}</b>事件：${state.event?'已建立':'未建立'} ｜ 明细：${state.lines} 条 ｜ 来源：${sourceText()}<br>凭证：${state.evidence?'已关联':'未关联'} ｜ 正式结果：${state.result==='formal'?'已形成':state.result==='canceled'?'已取消／失效':state.result==='correcting'?'纠正中':'未形成'} ｜ 回写：${callbackText()}</div>`;
function header(title,back){return `<header class="appbar"><button class="back" data-go="${back||'group'}">‹ ${labels[back||'group']}</button><h1>${title}</h1><button class="more">⋯</button></header>`}
function index(){return `<header class="hero"><div class="hero-top"><code>APP</code><span class="tag">原型审阅入口</span></div><h1>全部页面总览</h1><p>全局总览只用于审阅导航，不是业务员正式 APP 页面。手术植入以 I 组加入当前探索。</p></header><div class="body"><section class="section"><h2>现有业务组</h2><div class="card pad"><div class="row"><div><b>G · 全局入口</b><span>G01 是手术植入的独立入口。</span></div><span>已存在</span></div><div class="row"><div><b>O／T · 手术通知与任务</b><span>O01／G03「记录手术植入」携带任务、返回位置与候选实物。</span></div><span>接口</span></div></div></section><section class="section"><h2>I · 手术植入</h2><button class="route-card active" data-go="group"><b>I 组总览</b><span>建立事件 → 销售明细 → 来源 → 凭证提交 → 自动校验／正式结果 → 回写与纠正分支</span></button></section><section class="section"><h2>原型边界</h2><div class="map">I01—I05 仅为完整闭环的探索节点，不构成正式页面清单。库存、Web 后台、权限、审核、时限和幂等均保留为桩子。</div></section></div>`}
function group(){return `<header class="hero"><div class="hero-top"><code>I</code><span class="tag">完整闭环探索</span></div><h1>手术植入</h1><p>现实手术完成后登记实际销售事实。正式结果只由实际销售明细形成；通知来源明细才产生回写。</p></header><div class="body"><section class="section"><h2>选择进入场景</h2><button class="choice" data-start="g01"><b>G01 独立进入</b><span>新建同一种植入记录；不预带需求组。</span></button><button class="choice" data-start="notice"><b>O01／G03「记录手术植入」</b><span>携带需求组、来源任务、返回位置与候选实物；仅进入不构成结果。</span></button></section><section class="section"><h2>完整探索链</h2><div class="flow"><div class="flow-step"><b>I01 建立实际手术事件</b><span>患者、基础信息和动作事实；动作不自动形成销售。</span></div><div class="arrow">↓</div><div class="flow-step"><b>I02 添加实际销售明细</b><span>扫码／手动添加同一明细。</span></div><div class="arrow">↓</div><div class="flow-step"><b>I03 产品来源分配</b><span>业务员侧常备物资、通知来源或混合来源。</span></div><div class="arrow">↓</div><div class="flow-step"><b>I04 凭证与提交前确认</b><span>关联凭证，提交并触发自动校验。</span></div><div class="arrow">↓</div><div class="flow-step"><b>I05 校验、正式结果与恢复</b><span>未完成／异常不回写；正式结果才回写通知来源。</span></div></div></section><section class="section"><h2>后续分支</h2><div class="grid2"><button class="secondary" data-go="I05">查看结果／恢复</button><button class="secondary" data-go="index">返回全局总览</button></div></section></div>`}
function i01(){return `${header('I01 建立实际手术事件','group')}${context()}${statePanel()}<div class="body"><section class="section"><h2>当前角色能做什么</h2><p class="hint">业务员建立本次事件与植入销售记录。示例字段只验证已确认边界，不构成字段规格。</p><div class="card pad"><div class="field"><label>患者姓名</label><input value="示例患者" aria-label="患者姓名"></div><div class="field"><label>住院号</label><input value="示例住院号" aria-label="住院号"></div><div class="field"><label>实际手术动作（事实）</label><select><option>更换／翻修（不自动形成销售）</option><option>取出／保留（不自动形成销售）</option></select><p>动作事实与销售结果分离；具体字段和录入时点为桩子。</p></div></div></section><section class="section"><h2>点击结果</h2><div class="map">建立后：一名业务员＋一位患者＋一次实际手术事件形成一条植入销售记录，下一步进入 I02 添加实际销售明细。</div></section></div><div class="sticky"><button class="primary" data-action="SAVE_EVENT">建立事件并进入 I02</button><button class="secondary" data-go="group">返回 I 组总览</button></div>`}
function i02(){return `${header('I02 添加实际销售明细','I01')}${context()}${statePanel()}<div class="body"><section class="section"><h2>当前角色能做什么</h2><p class="hint">扫码与手动添加形成同一种实际销售明细。产品、批号／追溯身份（如有）和数量属于已确认记录边界。</p><div class="card pad"><div class="row"><div><b>示例产品 A</b><span>批号／追溯身份：示例 · 数量：1</span></div><strong>${state.lines?state.lines+' 条':'未添加'}</strong></div><div class="grid2"><button class="secondary" data-action="ADD_LINE">扫码添加</button><button class="secondary" data-action="ADD_LINE">手动添加</button></div></div></section><section class="section"><h2>点击结果</h2><div class="map">已添加明细后，可进入 I03 为每条实物销售明细记录来源；不会在本原型中查询或扣减库存。</div></section></div><div class="sticky"><button class="primary" data-action="TO_SOURCE">进入 I03 产品来源分配</button><button class="secondary" data-go="I01">返回 I01</button></div>`}
function i03(){return `${header('I03 产品来源分配','I02')}${context()}${statePanel()}<div class="body"><section class="section"><h2>为当前明细选择来源</h2><p class="hint">来源按实际销售明细记录。库存可用量、识别、扣减与恢复均不在本原型。</p><button class="choice ${state.source==='self'?'active':''}" data-source="self"><b>业务员侧常备物资</b><span>形成销售明细来源；不向手术通知回写。</span></button><button class="choice ${state.source==='notice'?'active':''}" data-source="notice"><b>手术通知来源</b><span>仅正式结果时回写对应候选实物、产品、批号／追溯身份和数量。</span></button><button class="choice ${state.source==='mixed'?'active':''}" data-source="mixed"><b>混合来源</b><span>同一记录可同时有业务员侧常备物资与通知来源；回写仅覆盖通知来源部分。</span></button></section><section class="section"><h2>点击结果</h2><div class="map">选择后进入 I04。通知入口的候选实物只是可选来源，不默认全选；业务员侧常备物资来源不会结束通知候选责任。</div></section></div><div class="sticky"><button class="secondary" data-go="I02">返回 I02</button></div>`}
function i04(){return `${header('I04 凭证关联与提交前确认','I03')}${context()}${statePanel()}<div class="body"><section class="section"><h2>凭证与完整性</h2><p class="hint">已上传凭证不可被后续文件静默覆盖。凭证类型、审核岗位和时限均未确认，只做关联占位。</p><div class="card pad"><div class="check"><span class="box ${state.evidence?'on':''}">${state.evidence?'✓':''}</span><span>医院要求凭证已关联</span><button class="secondary" data-action="EVIDENCE">关联凭证</button></div><div class="check"><span class="box ${state.event&&state.lines&&state.source&&state.evidence?'on':''}">${state.event&&state.lines&&state.source&&state.evidence?'✓':''}</span><span>提交前已具备探索所需对象</span><span class="tag">${state.event&&state.lines&&state.source&&state.evidence?'可提交':'待补齐'}</span></div></div></section><section class="section"><h2>自动校验探索场景</h2><p class="hint">这两个按钮是原型驱动器，不代表业务员能选择系统校验结果。</p><div class="grid2"><button class="primary" data-submit="pass">提交并验证通过</button><button class="secondary" data-submit="exception">提交并触发异常占位</button></div></section></div><div class="sticky"><button class="secondary" data-go="I03">返回 I03</button></div>`}
function resultBranch(){if(state.result==='formal')return `<div class="result"><h2>正式植入结果已形成</h2><p>正式记录引用：${state.recordRef}<br>只有通知来源明细触发回写。</p></div><div class="callback"><b>${callbackText()}</b>${state.source==='mixed'?'混合来源中，业务员侧常备物资部分不回写；通知来源部分随本记录引用回写。':state.source==='notice'?'手术通知据此完成相应任务并重算 O01 责任与结余。':'本次只有业务员侧常备物资来源，手术通知无回写。'}</div>`;if(state.result==='canceled')return `<div class="result"><h2>取消／失效探索结果</h2><p>原正式记录和原来源分配保留；仅通知来源部分反向回写。</p></div><div class="callback"><b>${callbackText()}</b>触发条件、权限、时限、幂等和重试仍为桩子。</div>`;if(state.validation==='exception')return `<div class="result"><h2>自动校验异常</h2><p>未形成正式结果，未回写手术通知。公司审核路径只作占位。</p></div>`;if(state.validation==='incomplete')return `<div class="result"><h2>未正式形成</h2><p>可补齐后重提，或明确放弃／超期退出；均不回写手术通知。</p></div>`;if(state.validation==='exited')return `<div class="result"><h2>记录已退出</h2><p>未形成正式结果，未触发通知回写。具体时限与权限为桩子。</p></div>`;return `<div class="result"><h2>等待提交</h2><p>尚未形成正式结果，也不会回写手术通知。</p></div>`}
function i05(){return `${header('I05 自动校验与正式结果','I04')}${context()}${statePanel()}<div class="body"><section class="section"><h2>当前结果</h2>${resultBranch()}</section><section class="section"><h2>可点击恢复与后续分支</h2>${state.result==='formal'?`<button class="choice" data-action="CANCEL"><b>模拟取消／失效事实</b><span>保留原记录，仅原通知来源明细反向回写；权限与时限为桩子。</span></button><button class="choice" data-action="CORRECT"><b>模拟销错冲正并形成正确结果</b><span>保留原记录，通知来源先反向调整，再回 I02 形成正确结果。</span></button><button class="primary" data-return-origin>返回 ${state.origin==='notice'?'O01／G03 上下文':'G01 独立入口'}</button>`:state.result==='canceled'?`<button class="secondary" data-go="group">返回 I 组总览</button>`:state.validation==='exception'||state.validation==='incomplete'?`<button class="primary" data-action="RESUME">补齐后重提</button><button class="danger" data-action="EXIT">退出记录（探索）</button>`:`<button class="primary" data-action="RESUME">回到 I01 补齐记录</button>`}</section><section class="section"><h2>未确认桩子</h2><div class="map">审核角色与反馈、权限、时限、通知回写重试／幂等、库存内部处理、销售结算均未在本原型中实现或宣称。</div></section></div><div class="sticky"><button class="secondary" data-go="I04">返回 I04</button></div>`}
function screen(){return({index,group,I01:i01,I02:i02,I03:i03,I04:i04,I05:i05}[state.route]||index)()}
function render(){document.getElementById('app').innerHTML=screen();document.getElementById('routebar').innerHTML=Object.entries(labels).map(([k,v])=>`<button class="${state.route===k?'active':''}" data-go="${k}">${v}</button>`).join('');document.getElementById('driver').innerHTML=`<b>探索状态（内存，不持久化）</b><code>${JSON.stringify({route:state.route,origin:state.origin,lines:state.lines,source:state.source,evidence:state.evidence,result:state.result,callback:state.callback})}</code><br><button data-reset>重置完整链路</button>`;document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>dispatch({type:'GO',route:x.dataset.go}));document.querySelectorAll('[data-start]').forEach(x=>x.onclick=()=>dispatch({type:'START',origin:x.dataset.start==='notice'?'notice':'g01'}));document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>dispatch({type:x.dataset.action}));document.querySelectorAll('[data-source]').forEach(x=>x.onclick=()=>dispatch({type:'SOURCE',source:x.dataset.source}));document.querySelectorAll('[data-submit]').forEach(x=>x.onclick=()=>dispatch({type:'SUBMIT',mode:x.dataset.submit}));document.querySelectorAll('[data-return-origin]').forEach(x=>x.onclick=()=>{state={...state,route:state.origin==='notice'?'group':'index',last:state.origin==='notice'?'已返回 O01／G03 上下文（探索）':'已返回 G01 独立入口（探索）'};setUrl();render()});document.querySelectorAll('[data-reset]').forEach(x=>x.onclick=()=>{state=ImplantMachine.initial();setUrl();render()})}
const params=new URLSearchParams(location.search);if(labels[params.get('route')])state.route=params.get('route');render();
</script>
</body>
</html>
